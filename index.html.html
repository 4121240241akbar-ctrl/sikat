<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<title>SIKAT Gerbang Kesembuhan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: bilah hijau lengket + tab, isi berupa panel berkepala warna (gaya purwarupa Lampiran 7), kartu gerbang berwarna semantik */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#edf2ef; --fg:#16231c; --muted:#5a6a61; --line:#d6e0da;
  --brand:#2e7d4f; --brand-2:#256b42; --on-brand:#ffffff;
  --blue:#3a6ea5; --navy:#1c2d5a; --navy-soft:#e6ebf6;
  --red:#b3202f; --red-soft:#f8e3e6; --amber:#d9970b; --amber-soft:#fcf1d9; --amber-ink:#8a5d00;
  --green:#1f9d55; --green-soft:#e3f4ea; --green-ink:#16733e; --grey-soft:#eceff1;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.05);
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201a; --surface-2:#1e2a23; --fg:#e4ede8; --muted:#9db0a5; --line:#2c3a32;
  --brand:#2c7f50; --brand-2:#246a43; --on-brand:#ffffff;
  --blue:#5b8fd0; --navy:#a9bbec; --navy-soft:#1f2740;
  --red:#ec6273; --red-soft:#3b1c22; --amber:#e3a52a; --amber-soft:#3a2f15; --amber-ink:#f1c55e;
  --green:#3cc47a; --green-soft:#163326; --green-ink:#72d9a0; --grey-soft:#232c28;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201a; --surface-2:#1e2a23; --fg:#e4ede8; --muted:#9db0a5; --line:#2c3a32;
  --brand:#2c7f50; --brand-2:#246a43; --on-brand:#ffffff;
  --blue:#5b8fd0; --navy:#a9bbec; --navy-soft:#1f2740;
  --red:#ec6273; --red-soft:#3b1c22; --amber:#e3a52a; --amber-soft:#3a2f15; --amber-ink:#f1c55e;
  --green:#3cc47a; --green-soft:#163326; --green-ink:#72d9a0; --grey-soft:#232c28;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top .wrap{display:flex;flex-direction:column;gap:6px;padding-block:12px 0}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.brandrow h1{font-size:18px;font-weight:600;letter-spacing:.1px}
.brandrow p{margin:0;font-size:12px;opacity:.85}
.brandtxt{min-width:0;flex:1}
.demo-pill{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:99px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--on-brand);text-decoration:none;font-weight:600;font-size:13.5px;padding:10px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap;opacity:.82;display:flex;align-items:center;gap:7px}
.tabs a:hover{opacity:1}
.tabs a[aria-current="page"]{opacity:1;border-bottom-color:#fff}
.tabs .count{background:rgba(255,255,255,.22);border-radius:99px;font-size:11px;padding:1px 7px}

main{padding-block:22px 60px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:22px;font-weight:700;color:var(--navy)}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}

/* panels (Lampiran 7) */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.panel>header{background:var(--brand);color:var(--on-brand);padding:9px 14px;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>header.blue{background:var(--blue)}
.panel>header.navy{background:#1c2d5a}
.panel>header small{font-weight:500;opacity:.85}
.panel .body{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}

/* form */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--fg)}
textarea.inp{resize:vertical;min-height:80px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>label.f{flex:1 1 140px}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer;line-height:1.4}
.chk input{width:17px;height:17px;margin-top:1px;accent-color:var(--brand);flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:7px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.green{background:var(--brand)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* gate banner */
.gate{border-radius:9px;padding:14px 16px;text-align:center;color:#fff}
.gate .t{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.3px;line-height:1.15}
.gate .s{font-size:13px;opacity:.95;margin-top:2px}
.gate.merah{background:var(--red)}
.gate.kuning{background:var(--amber)}
.gate.hijau{background:var(--green)}
.gate.tunggu{background:var(--grey-soft);color:var(--muted)}
.gate.selesai{background:var(--navy-soft);color:var(--navy)}
:root[data-theme="dark"] .gate.hijau,:root[data-theme="dark"] .gate.kuning{color:#0f1512}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gate.hijau,:root:not([data-theme="light"]) .gate.kuning{color:#0f1512}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.2px}
.pill.merah{background:var(--red-soft);color:var(--red)}
.pill.kuning{background:var(--amber-soft);color:var(--amber-ink)}
.pill.hijau{background:var(--green-soft);color:var(--green-ink)}
.pill.tunggu{background:var(--grey-soft);color:var(--muted)}
.pill.selesai{background:var(--navy-soft);color:var(--navy)}
.pill.p{font-family:var(--f-mono);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

.note{font-size:13px;color:var(--muted)}
.callout{border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.callout.amber{background:var(--amber-soft);color:var(--amber-ink)}
.callout.red{background:var(--red-soft);color:var(--red)}
.callout.green{background:var(--green-soft);color:var(--green-ink)}
.callout.navy{background:var(--navy-soft);color:var(--navy)}
.callout b{font-weight:700}
.lbl{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px dashed var(--line);margin:2px 0}

/* KPI */
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--green)}
.bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.ok{color:var(--green-ink)} .warn{color:var(--amber-ink)} .bad{color:var(--red)}

/* table/list */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.caselist{display:flex;flex-direction:column;gap:8px}
.casecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;width:100%}
.casecard:hover{border-color:var(--brand)}
.casecard .stripe{width:5px;align-self:stretch;border-radius:4px}
.casecard h4{font-size:15px;font-weight:600}
.casecard .meta{font-size:12.5px;color:var(--muted)}
.casecard .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.stripe.merah{background:var(--red)} .stripe.kuning{background:var(--amber)} .stripe.hijau{background:var(--green)} .stripe.tunggu{background:var(--line)} .stripe.selesai{background:var(--navy)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.tl-item:last-child{border-bottom:0}
.incub{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.incub i{display:block;height:100%;background:var(--blue)}

/* kartu serumah */
.kartu{border:1.5px dashed var(--blue);border-radius:9px;padding:13px 15px;font-size:13.5px;line-height:1.55;background:var(--surface)}
.kartu h5{margin:0 0 4px;font-family:var(--f-display);font-size:14px;letter-spacing:.4px}
.kartu .kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px}
.kartu .kv span:nth-child(odd){color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}

/* wood grid */
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:520px}
.dots i{aspect-ratio:1;border-radius:50%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* raci */
.raci td,.raci th{text-align:center;padding:7px 6px;font-size:12px}
.raci td:first-child,.raci th:first-child{text-align:left;font-weight:600;font-size:13px;min-width:180px}
.rc{display:inline-block;min-width:38px;padding:4px 6px;border-radius:6px;font-weight:700;font-size:11.5px}
.rc.RA{background:#1c2d5a;color:#fff}
.rc.C{background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber)}
.rc.I{background:var(--grey-soft);color:var(--muted)}
.raci .dim{opacity:.18}
.raci th.hl{background:var(--brand);color:#fff}

/* steps */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-display)}
.step.done .n{background:var(--green)}
.step.done .txt{color:var(--muted);text-decoration:line-through}

.range{display:flex;flex-direction:column;gap:3px}
.range .top-r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:500}
.range output{font-family:var(--f-mono);color:var(--fg);font-weight:500}
input[type=range]{width:100%;accent-color:var(--brand)}

.big{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.stat .k{font-size:12px;color:var(--muted)}
.heat{border-radius:8px;padding:10px 12px;border:1px solid}
.heat.g{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.heat.a{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
.heat.r{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.heat .big{font-size:24px}
.heat small{display:block;font-size:12px;opacity:.9}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1c2d5a;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:30px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.ai-out{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:14px;min-height:60px}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}.tl-item{grid-template-columns:78px minmax(0,1fr)}.tl-item>:last-child{grid-column:1/-1}.gate .t{font-size:20px}}
@media (max-width:900px){.side-first{order:-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="wrap">
    <div class="brandrow">
      <div class="logo" aria-hidden="true">

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = isoOf(new Date());
const toD = s => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return isoOf(d); };
const diffDays = (a, b) => Math.round((toD(b) - toD(a)) / 864e5); // b - a
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtD = s => { if (!s) return '–'; const d = toD(s); return `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDs = s => { const d = toD(s); return `${d.getDate()} ${BLN[d.getMonth()]}`; };
const nf = (n, d = 0) => Number(n).toLocaleString('id-ID', {minimumFractionDigits: d, maximumFractionDigits: d});
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const uid = () => Math.random().toString(36).slice(2, 8);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }

/* ============ domain: skor-P & gerbang ============ */
const WILAYAH = ['Kota Malang', 'Kabupaten Malang', 'Kota Batu'];
const KLINIK = ['Klinik Mitra 1', 'Klinik Mitra 2', 'Klinik Mitra 3', 'Klinik Mitra 4', 'Klinik Mitra 5'];
const RISIKO = [
  ['penyerta', 'Penyakit penyerta pada kucing'],
  ['multi', 'Rumah multikucing'],
  ['balita', 'Serumah dengan balita'],
  ['lansia', 'Serumah dengan lansia'],
  ['imun', 'Anggota keluarga berimunitas rendah'],
];
function pScore(k){
  if (k === null || k === undefined || k === '') return null;
  k = Number(k);
  if (k <= 0) return 'Negatif';
  if (k <= 4) return 'P1';
  if (k <= 9) return 'P2';
  return 'P3';
}
// inti keputusan gerbang (Gambar 3 esai)
function evalGate({koloni, lesi, negRun, berisiko}){
  const p = pScore(koloni);
  if (p === null) return {kode:'tunggu', cls:'tunggu', judul:'MENUNGGU KULTUR', sub:'Belum ada hasil', teks:'Kirim sampel sikat gigi ke Lab ADD FKH UB. Hasil negatif baru sah setelah pengamatan 21 hari.'};
  if (p === 'P3' || (lesi && p !== 'Negatif'))
    return {kode:'merah', cls:'merah', judul:'GERBANG MERAH', sub:'Skor ' + p + (lesi ? ' · lesi aktif' : ''), teks:'Lesi masih aktif atau beban spora tinggi. Lanjutkan terapi sistemik (itrakonazol 5 mg/kg pola satu minggu beri, satu minggu jeda, atau terbinafin) ditambah terapi topikal dua kali seminggu. Kultur ulang tiap 2 minggu.'};
  if (p === 'Negatif' && lesi)
    return {kode:'merah', cls:'merah', judul:'GERBANG MERAH', sub:'Kultur negatif · lesi masih ada', teks:'Lesi belum hilang walau kultur negatif. Pertahankan terapi, tinjau diagnosis banding lesi kulit, dan ulangi kultur 2 minggu lagi sebelum gerbang dibuka.'};
  if (p === 'P1' || p === 'P2')
    return {kode:'kuning', cls:'kuning', judul:'GERBANG KUNING', sub:'Skor ' + p, teks:'Lesi hilang tetapi spora tersisa. Teruskan terapi sistemik, mandikan antijamur, bersihkan rumah sebelum kultur ulang.'};
  // negatif tanpa lesi
  if (!berisiko)
    return {kode:'hijau1', cls:'hijau', judul:'GERBANG HIJAU', sub:'Hijau Tunggal · kultur negatif', teks:'Kultur negatif pertama pada rumah berisiko rendah. Terapi boleh dihentikan, kasus ditutup, lalu dipantau 90 hari.', tutup:true};
  if (negRun >= 2)
    return {kode:'hijau2b', cls:'hijau', judul:'GERBANG HIJAU', sub:'Hijau Ganda · 2 kultur negatif', teks:'Dua kultur negatif berturut-turut. Kesembuhan mikologis terkonfirmasi untuk rumah berisiko. Kasus boleh ditutup dan dipantau 90 hari.', tutup:true};
  return {kode:'hijau2a', cls:'hijau', judul:'GERBANG HIJAU GANDA', sub:'Kultur negatif ke-1 dari 2', teks:'Rumah berisiko: teruskan terapi, bersihkan rumah, lalu ambil kultur penutup kedua dalam 1–3 minggu. Kasus ditutup setelah kultur kedua negatif.'};
}
const isRisky = c => RISIKO.some(([k]) => c.risiko?.[k]);
const sortedKultur = c => [...c.kultur].sort((a, b) => a.tgl.localeCompare(b.tgl));
const resulted = c => sortedKultur(c).filter(k => k.koloni !== null);
const pending = c => sortedKultur(c).filter(k => k.koloni === null);
function negRunOf(c){ let n = 0; const r = resulted(c); for (let i = r.length - 1; i >= 0; i--){ if (Number(r[i].koloni) === 0) n++; else break; } return n; }
function gateOf(c){
  const r = resulted(c), last = r[r.length - 1];
  const g = evalGate({koloni: last ? last.koloni : null, lesi: last ? last.lesi : false, negRun: negRunOf(c), berisiko: isRisky(c)});
  if (c.ditutup){
    if (c.kambuh) return {...g, kode:'kambuh', cls:'merah', judul:'POSITIF ULANG', sub:'Setelah penutupan ' + fmtD(c.ditutup), teks:'Kucing kembali positif setelah kasus ditutup. Buka kembali kasus, mulai lagi dari Gerbang Merah, dan ajukan uji kepekaan antijamur.'};
    const hari = diffDays(c.ditutup, TODAY);
    return {...g, kode:'selesai', cls:'selesai', judul:'KASUS DITUTUP', sub: hari <= 90 ? `Pemantauan hari ke-${hari} dari 90` : 'Pemantauan 90 hari selesai', teks: hari <= 90 ? 'Kucing dalam masa pantau 90 hari. Catat bila kultur kembali positif.' : 'Tidak ada positif ulang tercatat selama 90 hari.'};
  }
  return g;
}
function greenDate(c){ // tanggal kultur yang pertama membuka gerbang hijau (dari rangkaian negatif terakhir)
  const r = resulted(c); const n = negRunOf(c); if (!n) return null;
  const first = r[r.length - n]; if (first.lesi) return null; return first.tgl;
}
function nextAction(c){
  const g = gateOf(c); const p = pending(c); const r = resulted(c); const last = r[r.length - 1];
  if (c.ditutup) return null;
  if (p.length) { const d = diffDays(p[0].tgl, TODAY); return d >= 21 ? {lvl:'bad', txt:`Hasil kultur ${fmtDs(p[0].tgl)} sudah hari ke-${d}, segera dilaporkan`} : {lvl:'info', txt:`Inkubasi hari ke-${d} dari 21`}; }
  if (!last) return {lvl:'bad', txt:'Belum ada sampel dikirim'};
  if (g.tutup) return {lvl:'ok', txt:'Siap ditutup (Akhir Terapi)'};
  const win = g.kode === 'hijau2a' ? [7, 21] : [14, 14];
  const due = addDays(last.tgl, win[0]), late = addDays(last.tgl, win[1]);
  const dd = diffDays(TODAY, due);
  if (g.kode === 'hijau2a') {
    if (TODAY < due) return {lvl:'info', txt:`Kultur penutup ke-2: ${fmtDs(due)} – ${fmtDs(late)}`};
    if (TODAY <= late) return {lvl:'warn', txt:`Ambil kultur penutup ke-2 sekarang (s.d. ${fmtDs(late)})`};
    return {lvl:'bad', txt:`Kultur penutup ke-2 terlambat sejak ${fmtDs(late)}`};
  }
  if (dd > 0) return {lvl:'info', txt:`Kultur ulang ${fmtDs(due)} (${dd} hari lagi)`};
  if (dd === 0) return {lvl:'warn', txt:'Kultur ulang jatuh tempo hari ini'};
  return {lvl:'bad', txt:`Kultur ulang terlambat ${-dd} hari`};
}

const gatePill = g => `<span class="pill ${g.cls}"><span class="dot"></span>${esc(g.judul.replace('GERBANG ','').replace('KASUS ','')).toLowerCase().replace(/^./, s => s.toUpperCase())}</span>`;

/* ============ VIEW: Ringkasan ============ */
function kpis(){
  const cs = S.cases;
  // T1: mencapai hijau ≤16 minggu
  let elig = 0, hit = 0;
  cs.forEach(c => { const gd = greenDate(c) || (c.ditutup ? c.ditutup : null); const age = diffDays(c.mulai, TODAY);
    if (gd) { elig++; if (diffDays(c.mulai, gd) <= 112) hit++; } else if (age > 112) elig++; });
  // T2: positif ulang ≤90 hari
  const closed = cs.filter(c => c.ditutup); const rel = closed.filter(c => c.kambuh && diffDays(c.ditutup, c.kambuh) <= 90).length;
  // T3: anggota berlesi yang diperiksa puskesmas
  const mem = cs.flatMap(c => c.keluarga || []).filter(m => m.kepala || m.tubuh || m.gatal); const ref = mem.filter(m => m.dirujuk).length;
  return {t1: elig ? hit/elig : null, t1n:`${hit}/${elig}`, t2: closed.length ? rel/closed.length : null, t2n:`${rel}/${closed.length}`, t3: mem.length ? ref/mem.length : null, t3n:`${ref}/${mem.length}`};
}
function kpiCard(title, val, n, target, higherBetter, note){
  const pct = val === null ? null : val * 100;
  const ok = pct === null ? null : (higherBetter ? pct >= target : pct <= target);
  const cls = ok === null ? '' : ok ? 'ok' : 'bad';
  return `<div class="panel"><div class="kpi">
    <span class="lbl">${title}</span>
    <div class="row" style="align-items:baseline;gap:8px"><span class="v ${cls}">${pct === null ? '–' : nf(pct,0) + '%'}</span><span class="note mono">${n}</span></div>
    <div class="bar"><i style="width:${Math.min(100, pct ?? 0)}%;background:${ok===false?'var(--red)':'var(--green)'}"></i><span class="tgt" style="left:${target}%"></span></div>
    <span class="d">Target ${higherBetter ? '≥' : '≤'} ${target}% · ${note}</span></div></div>`;
}

  // peta skor-P per wilayah
  const peta = WILAYAH.map(w => { const r = {w, P1:0, P2:0, P3:0, Neg:0}; cs.filter(c => c.wilayah === w).forEach(c => resulted(c).forEach(x => { const p = pScore(x.koloni); r[p === 'Negatif' ? 'Neg' : p]++; })); r.tot = r.P1+r.P2+r.P3+r.Neg; return r; });
  return `
  <div class="view-head"><div><h2>Ringkasan uji coba Malang Raya</h2><p>Tiga target SMART dari esai dihitung langsung dari kasus yang dicatat klinik mitra. Garis tegak pada bilah adalah ambang target.</p></div>

  <div class="grid g3">
    ${kpiCard('Mencapai Gerbang Hijau ≤ 16 minggu', k.t1, k.t1n, 80, true, 'dari kucing yang sudah hijau atau sudah > 16 minggu')}
    ${kpiCard('Positif ulang ≤ 90 hari setelah ditutup', k.t2, k.t2n, 5, false, 'dari kasus yang sudah ditutup')}
    ${kpiCard('Kartu Serumah berlesi → puskesmas', k.t3, k.t3n, 50, true, 'anggota keluarga berlesi yang sudah diperiksa')}
  </div>
  <div class="grid g-side" style="margin-top:16px">
    <section class="panel"><header>Perlu tindakan <small>${act.length} kasus</small></header><div class="body">
      ${act.length ? `<div class="caselist">${act.map(({c, a, g}) => caseCard(c, g, a)).join('')}</div>` : '<div class="empty">Tidak ada kultur jatuh tempo. Semua kasus sesuai jadwal.</div>'}
    </div></section>
    <div class="grid" style="align-content:start">
      <section class="panel"><header>Sebaran gerbang <small>${cs.length} kasus</small></header><div class="body">
        <div style="display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2)">
          ${['merah','kuning','hijau','tunggu','selesai'].map(x => `<span title="${x}" style="width:${counts[x]/tot*100}%;background:var(--${x==='tunggu'?'line':x==='selesai'?'navy':x==='merah'?'red':x==='kuning'?'amber':'green'})"></span>`).join('')}

          <div class="note mono" style="font-size:11.5px;margin-top:3px">P3 ${r.P3} · P2 ${r.P2} · P1 ${r.P1} · Neg ${r.Neg}</div></div>`).join('')}
        <p class="note" style="margin:0">Dilaporkan ke dinas yang membidangi kesehatan hewan sebagai peta beban spora.</p>
      </div></section>
    </div>
  </div>
  ${dataTools()}
  <div class="foot">Angka di halaman ini dihitung dari data yang tersimpan di peramban Anda. ${S.demo ? 'Saat ini berisi <b>data contoh</b> untuk peragaan, bukan data lapangan.' : ''}</div>`;
}

function caseCard(c, g = gateOf(c), a = nextAction(c)){

function chartSVG(c){
  const r = resulted(c); const W = 560, H = 190, L = 34, Rr = 12, T = 12, B = 30;
  const maxWk = Math.max(8, Math.ceil(diffDays(c.mulai, TODAY)/7) + 1);
  const yMax = 16; const x = w => L + (W - L - Rr) * w / maxWk; const y = v => T + (H - T - B) * (1 - Math.min(v, yMax)/yMax);
  const band = (a, b, col, op) => `<rect x="${L}" y="${y(b)}" width="${W-L-Rr}" height="${y(a)-y(b)}" fill="var(--${col})" opacity="${op}"/>`;
  const pts = r.map(k => [diffDays(c.mulai, k.tgl)/7, Number(k.koloni), k]);
  const ticksX = []; for (let w = 0; w <= maxWk; w += maxWk > 16 ? 4 : 2) ticksX.push(w);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva jumlah koloni per minggu">
    ${band(0.5,4.5,'amber',.10)}${band(4.5,9.5,'amber',.2)}${band(9.5,yMax,'red',.12)}
    ${[0,5,10,15].map(v => `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <text x="${W-Rr-4}" y="${y(12.6)}" text-anchor="end" style="font-weight:600">P3</text><text x="${W-Rr-4}" y="${y(7.4)}" text-anchor="end" style="font-weight:600">P2</text><text x="${W-Rr-4}" y="${y(2.4)}" text-anchor="end" style="font-weight:600">P1</text>
    ${ticksX.map(w => `<text x="${x(w)}" y="${H-10}" text-anchor="middle">mg ${w}</text>`).join('')}
    <line x1="${x(16)}" x2="${x(16)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="${maxWk>=16?.8:0}"/>
    ${maxWk>=16?`<text x="${x(16)-4}" y="${T+10}" text-anchor="end">target 16 mg</text>`:''}
    ${pts.length > 1 ? `<polyline fill="none" stroke="var(--navy)" stroke-width="2" points="${pts.map(p => x(p[0]) + ',' + y(p[1])).join(' ')}"/>` : ''}
    ${pts.map((p, i) => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${i===pts.length-1?5.5:4}" fill="${p[1]===0?'var(--green)':p[1]>=10?'var(--red)':'var(--amber)'}" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    ${pending(c).map(k => `<circle cx="${x(diffDays(c.mulai, k.tgl)/7)}" cy="${y(0)}" r="4" fill="var(--surface)" stroke="var(--blue)" stroke-width="2" stroke-dasharray="2 2"/>`).join('')}
  </svg><div class="legend" style="margin-top:4px"><span><i style="background:var(--red)"></i>P3</span><span><i style="background:var(--amber)"></i>P1–P2</span><span><i style="background:var(--green)"></i>Negatif</span><span><i style="background:transparent;border:2px dashed var(--blue)"></i>Inkubasi</span></div>`;
}
function terapi(c){
  const bb = Number(c.bb) || 0;
  const itra = 5 * bb, terbLo = 30 * bb, terbHi = 40 * bb;
  const start = c.mulai; const weeks = [];
  for (let i = 0; i < 12; i++) weeks.push({i, mulai: addDays(start, i*7), beri: i % 2 === 0});
  const curW = Math.floor(diffDays(start, TODAY)/7);
  return `
    <div class="row">
      <label class="f" style="flex:0 1 140px">Berat badan (kg)<input class="inp" type="number" step="0.1" min="0.3" id="bb" value="${bb}"></label>

        <button data-act="obat" data-v="itra" aria-pressed="${c.obat==='itra'}">Itrakonazol</button>
        <button data-act="obat" data-v="terb" aria-pressed="${c.obat==='terb'}">Terbinafin</button></div>
    </div>
    ${c.obat === 'itra' ? `
      <div class="grid g2" style="gap:8px">
        <div class="stat"><span class="k">Dosis harian (5 mg/kg)</span><span class="big mono" style="font-size:22px">${nf(itra,1)} mg</span></div>
        <div class="stat"><span class="k">Larutan oral 10 mg/mL</span><span class="big mono" style="font-size:22px">${nf(itra/10,2)} mL</span></div>
      </div>
      <div><span class="lbl">Kalender pulsa: 1 minggu beri, 1 minggu jeda</span>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:6px">
        ${weeks.map(w => `<div style="border-radius:6px;padding:5px 4px;text-align:center;font-size:11.5px;background:${w.beri?'var(--green-soft)':'var(--surface-2)'};color:${w.beri?'var(--green-ink)':'var(--muted)'};outline:${w.i===curW?'2px solid var(--blue)':'none'}">
          <b>Mg ${w.i+1}</b><br>${w.beri?'Beri':'Jeda'}<br><span class="mono" style="font-size:10.5px">${fmtDs(w.mulai)}</span></div>`).join('')}
      </div></div>` : `
      <div class="grid g2" style="gap:8px">
        <div class="stat"><span class="k">Dosis harian (30–40 mg/kg)</span><span class="big mono" style="font-size:22px">${nf(terbLo,0)}–${nf(terbHi,0)} mg</span></div>
        <div class="stat"><span class="k">Jadwal</span><span style="font-weight:600">Sekali sehari, tiap hari sampai gerbang hijau</span></div>
      </div>`}
    <div class="callout navy"><b>Topikal:</b> mandi atau bilas antijamur (lime sulfur atau sampo mikonazol-klorheksidin) dua kali seminggu selama Gerbang Merah dan Kuning.</div>
    <p class="note" style="margin:0">Dosis acuan pedoman WAVD (Moriello et al., 2017). Ketokonazol tidak dianjurkan karena kurang efektif dengan efek samping lebih banyak. Resep tetap kewenangan dokter hewan klinik.</p>`;
}

function kartuFile(d){

/* ============ VIEW: Kalkulator cepat (Lampiran 7) ============ */
function vKalkulator(){
  const q = S.quick; const g = evalGate({koloni: q.koloni === '' ? null : Number(q.koloni), lesi: q.lesi, negRun: Number(q.neg)||0, berisiko: q.risk});
  const d = {nama: q.nama || '…', pemilik: q.pemilik || '…', klinik:'Klinik mitra', positif:true, pLast: pScore(q.koloni) ?? '–', bebas:q.bebas, cuci:q.cuci, keluarga:[]};
  const rows = [[0,'Negatif'],[3,'P1'],[7,'P2'],[12,'P3']];
  return `
  <div class="view-head"><div><h2>Kalkulator Gerbang SIKAT</h2><p>Mode cepat untuk petugas lapangan: masukkan hasil kultur terbaru, gerbang warna keluar otomatis. Simpan sebagai kasus bila ingin dipantau.</p></div></div>
  <div class="grid g2">
    <section class="panel"><header>Hasil kultur terbaru</header><div class="body">
      <label class="f">Jumlah koloni dermatofit per cawan<input class="inp" type="number" min="0" id="qk_kol" value="${esc(q.koloni)}" inputmode="numeric"></label>
      <div class="row" style="gap:6px">${rows.map(([v,l]) => `<button class="btn ghost sm" data-act="qset" data-v="${v}">${l} (${v})</button>`).join('')}</div>
      <label class="f">Lesi klinis masih ada?<select class="inp" id="qk_lesi"><option value="0" ${!q.lesi?'selected':''}>Tidak</option><option value="1" ${q.lesi?'selected':''}>Ya</option></select></label>
      <label class="f">Kultur negatif berturut-turut<input class="inp" type="number" min="0" max="5" id="qk_neg" value="${esc(q.neg)}"></label>
      <label class="f">Rumah berisiko (multikucing, balita, lansia, imunitas rendah, penyakit penyerta)<select class="inp" id="qk_risk"><option value="0" ${!q.risk?'selected':''}>Tidak</option><option value="1" ${q.risk?'selected':''}>Ya</option></select></label>
      ${Number(q.koloni) === 0 && q.koloni !== '' && Number(q.neg) < 1 ? `<div class="callout amber">Koloni 0 berarti kultur ini negatif. Isi kultur negatif berturut-turut minimal 1.</div>` : ''}
    </div></section>
    <section class="panel"><header>Keputusan gerbang</header><div class="body">
      <div class="gate ${g.cls}"><div class="t">${g.judul}</div><div class="s">${esc(g.sub)}</div></div>
      <p style="margin:0">${esc(g.teks)}</p>
      <div class="tbl-wrap"><table><thead><tr><th>Skor-P</th><th>Koloni per cawan</th></tr></thead><tbody>
        ${[['P1','1–4'],['P2','5–9'],['P3','≥ 10']].map(([p,k]) => `<tr style="${pScore(q.koloni)===p?'background:var(--surface-2);font-weight:700':''}"><td class="mono">${p}</td><td>${k}</td></tr>`).join('')}
      </tbody></table></div>
    </div></section>
  </div>
  <section class="panel" style="margin-top:16px"><header class="blue">Kartu Serumah</header><div class="body">
    <div class="row"><label class="f">Nama kucing<input class="inp" id="qk_nama" value="${esc(q.nama)}" placeholder="mis. Oyen"></label><label class="f">Pemilik<input class="inp" id="qk_pemilik" value="${esc(q.pemilik)}" placeholder="mis. Ibu Rina"></label></div>
    <div class="checks"><label class="chk"><input type="checkbox" id="qk_bebas" ${q.bebas?'checked':''}>Kucing bebas berkeliaran</label><label class="chk"><input type="checkbox" id="qk_cuci" ${q.cuci?'checked':''}>Tidak cuci tangan sebelum memegang kucing</label></div>
    <div class="kartu">${kartuInner(d)}</div>
    <div class="row"><button class="btn" data-act="qDl">Unduh kartu</button><button class="btn ghost sm" data-act="qCopy">Salin teks</button><button class="btn green" data-act="qSave">Simpan sebagai kasus</button></div>
  </div></section>`;
}

/* ============ VIEW: Lab ============ */
function vLab(){
  const items = S.cases.filter(c => !c.ditutup || c.kambuh).flatMap(c => pending(c).map(k => ({c, k, d: diffDays(k.tgl, TODAY)}))).sort((a, b) => b.d - a.d);
  const inc = items.length; const cap = S.labCap;
  const month = TODAY.slice(0, 7);
  const perKlinik = KLINIK.map(k => ({k, n: S.cases.filter(c => c.klinik === k).flatMap(c => c.kultur).filter(x => x.tgl.startsWith(month)).length}));
  const quota = Math.floor(cap / KLINIK.length);
  return `
  <div class="view-head"><div><h2>Antrean Lab ADD FKH UB</h2><p>Langkah Inkubasi: bulu sikat ditekan ke media DTM pada 4–5 titik, cawan diamati hingga 21 hari, setiap koloni dikonfirmasi mikroskopis lalu dilaporkan sebagai skor-P.</p></div></div>
  <div class="grid g3">
    <div class="panel"><div class="kpi"><span class="lbl">Cawan di inkubator</span><span class="v">${inc}</span><div class="bar"><i style="width:${Math.min(100, inc/cap*100)}%;background:${inc>cap?'var(--red)':'var(--blue)'}"></i></div><span class="d">dari kapasitas ${cap} cawan</span></div></div>
    <div class="panel"><div class="kpi"><span class="lbl">Siap dilaporkan (≥ 21 hari)</span><span class="v ${items.some(x=>x.d>=21)?'bad':''}">${items.filter(x => x.d >= 21).length}</span><span class="d">negatif hanya sah setelah hari ke-21</span></div></div>
    <div class="panel"><div class="kpi"><span class="lbl">Kapasitas inkubator</span>
      <input type="range" id="labCap" min="10" max="500" step="10" value="${cap}"><span class="d">Kuota sampel per klinik per bulan: <b class="mono">${quota}</b></span></div></div>
  </div>
  <section class="panel" style="margin-top:16px"><header>Cawan dalam inkubasi <small>urut dari yang paling lama</small></header><div class="body">
    ${items.length ? `<div class="tbl-wrap"><table><thead><tr><th>Kucing</th><th>Klinik</th><th>Sampel</th><th style="min-width:150px">Inkubasi</th><th>Laporkan hasil</th></tr></thead><tbody>
      ${items.map(({c, k, d}) => `<tr><td><a href="#kasus-${c.id}"><b>${esc(c.nama)}</b></a>${k.lesi?'<br><span class="note">lesi ada</span>':''}</td><td>${esc(c.klinik)}</td><td class="mono">${fmtDs(k.tgl)}</td>
        <td><span class="mono ${d>=21?'bad':''}">hari ${d}/21</span><div class="incub"><i style="width:${Math.min(100,d/21*100)}%;background:${d>=21?'var(--red)':'var(--blue)'}"></i></div></td>
        <td><div class="row" style="gap:6px;flex-wrap:nowrap"><input class="inp" type="number" min="0" placeholder="koloni" style="width:84px" data-kol="${k.id}"><button class="btn sm" data-act="setKol" data-k="${k.id}" data-c="${c.id}">Simpan</button><button class="btn ghost sm" data-act="setNeg" data-k="${k.id}" data-c="${c.id}" ${d<21?'disabled':''}>Negatif</button></div></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Tidak ada cawan dalam inkubasi.</div>'}
  </div></section>
  <section class="panel" style="margin-top:16px"><header class="navy">Sampel bulan ini per klinik <small>kuota ${quota}</small></header><div class="body">
    ${perKlinik.map(p => `<div class="row" style="gap:10px"><span style="flex:0 0 120px;font-size:13.5px">${p.k}</span><div class="bar" style="flex:1"><i style="width:${Math.min(100, p.n/Math.max(1,quota)*100)}%;background:${p.n>quota?'var(--red)':'var(--green)'}"></i></div><span class="mono" style="width:52px;text-align:right">${p.n}/${quota}</span></div>`).join('')}
    <p class="note" style="margin:0">Lampiran 2 butir 14–15: rata-rata ±130 cawan di inkubator untuk lima klinik, batas atas ±440 cawan dikendalikan dengan kuota.</p>
  </div></section>`;
}

/* ============ VIEW: Simulator ============ */
function vSimulator(){
  const R = (id, label, min, max, step, val, unit = '') => `<div class="range"><div class="top-r"><label for="${id}">${label}</label><output id="${id}_o"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
  return `
  <div class="view-head"><div><h2>Simulator kelayakan</h2><p>Uji sendiri angka di Lampiran 2 dan 3: ubah kasus per tahun, jumlah klinik, porsi rumah Hijau Ganda, dan tarif. Di bawahnya, simulator lampu Wood menunjukkan mengapa kultur diperlukan.</p></div></div>
  <section class="panel"><header>Beban &amp; biaya kultur</header><div class="body">
    <div class="row" style="gap:6px"><span class="lbl" style="margin-right:4px">Skenario</span>
      <button class="btn ghost sm" data-act="scen" data-v="30">Tahun terendah 2020 · 30 kasus</button>
      <button class="btn ghost sm" data-act="scen" data-v="87">Rata-rata · 87 kasus</button>
      <button class="btn ghost sm" data-act="scen" data-v="195">Tahun puncak 2021 · 195 kasus</button>
      <button class="btn ghost sm" data-act="scen" data-v="berat">Batas atas jalur berat</button></div>
    <div class="grid g2" style="gap:14px 28px">
      ${R('s_kasus','Kasus per tahun per klinik',10,300,1,87)}
      ${R('s_klinik','Jumlah klinik mitra',1,20,1,5)}
      ${R('s_ganda','Porsi rumah masuk Hijau Ganda',0,100,1,100,'%')}
      ${R('s_berat','Porsi kasus jalur berat (penyakit penyerta)',0,100,0.1,4.6,'%')}
      ${R('s_tarif','Tarif per sampel',25000,150000,5000,50000,'rp')}
      ${R('s_hk','Hari kerja per bulan',18,26,1,22)}
    </div>
    <div id="bebanOut"></div>
  </div></section>

  <section class="panel" style="margin-top:16px"><header class="navy">Simulator lampu Wood vs kultur <small>100 kucing</small></header><div class="body">
    <div class="row" style="gap:6px"><span class="lbl" style="margin-right:4px">Preset</span>
      <button class="btn ghost sm" data-act="wood" data-v="ceko">Penampungan Ceko (Mrazkova 2023)</button>
      <button class="btn ghost sm" data-act="wood" data-v="bogor">Penampungan Bogor (Wen 2026)</button></div>
    <div class="grid g3" style="gap:14px 28px">
      ${R('w_prev','Prevalensi kultur positif',1,80,1,10,'%')}
      ${R('w_sens','Sensitivitas lampu Wood',30,100,1,71,'%')}
      ${R('w_spec','Spesifisitas lampu Wood',30,100,1,92,'%')}
    </div>
    <div class="grid g-side" style="gap:18px;align-items:start">
      <div><div class="dots" id="woodDots"></div>
        <div class="legend" style="margin-top:10px"><span><i style="background:var(--red)"></i>Berpendar &amp; kultur positif</span><span><i style="background:var(--amber)"></i>Berpendar, kultur negatif</span><span><i style="background:transparent;border:2px solid var(--red)"></i>Tak berpendar, kultur positif (lolos)</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Negatif keduanya</span></div></div>
      <div id="woodOut" class="grid" style="gap:10px"></div>
    </div>
  </div></section>`;
}
function calcBeban(){
  const v = id => Number($('#'+id)?.value);
  const kasus = v('s_kasus'), klinik = v('s_klinik'), ganda = v('s_ganda')/100, berat = v('s_berat')/100, tarif = v('s_tarif'), hk = v('s_hk');
  ['s_kasus','s_klinik','s_ganda','s_berat','s_tarif','s_hk'].forEach(id => { const el = $('#'+id); const u = el.dataset.unit; $('#'+id+'_o').textContent = u === 'rp' ? rp(el.value) : u === '%' ? nf(el.value, id==='s_berat'?1:0) + '%' : el.value; });
  // proporsi jalur Stuntebeck & Moriello 2020: 90,3% sederhana, 5,1% negatif pertama keliru, 4,6% penyakit penyerta
  const rest = 1 - berat; const pS = rest * (0.903/0.954), pK = rest * (0.051/0.954);
  const kpc = pS*(4+ganda) + pK*(5+ganda) + berat*8;
  const perBulan = kasus * kpc / 12, cawanHari = perBulan / hk;
  const labHari = cawanHari * klinik, inkubator = labHari * 15;
  const biaya = kpc * tarif;
  const cls = cawanHari < 2 ? 'g' : cawanHari <= 4 ? 'a' : 'r';
  const clsL = inkubator <= 150 ? 'g' : inkubator <= 300 ? 'a' : 'r';
  $('#bebanOut').innerHTML = `<div class="grid g4" style="gap:10px">
    <div class="heat g"><small>Kultur per kasus</small><span class="big">${nf(kpc,2)}</span><small>rerata tertimbang jalur</small></div>
    <div class="heat ${cls}"><small>Satu klinik</small><span class="big">${nf(cawanHari,2)}</span><small>cawan per hari kerja · ${nf(perBulan,1)} kultur/bulan</small></div>
    <div class="heat ${clsL}"><small>Lab untuk ${klinik} klinik</small><span class="big">${nf(labHari,1)}</span><small>cawan per hari · ±${nf(inkubator,0)} cawan di inkubator</small></div>
    <div class="heat g"><small>Biaya kultur per kasus</small><span class="big">${rp(biaya)}</span><small>${rp(4*tarif)} – ${rp(8*tarif)} menurut jalur</small></div>
  </div>
  <p class="note" style="margin:0">Rumus Lampiran 2: kultur/kasus = p<sub>sederhana</sub>×(4+g) + p<sub>keliru</sub>×(5+g) + p<sub>penyerta</sub>×8, dengan g = porsi Hijau Ganda. Cawan per hari = kasus × kultur/kasus ÷ 12 ÷ hari kerja. Inkubator ≈ cawan per hari × 15 hari kerja (21 hari). Warna: hijau &lt; 2, kuning 2–4, merah &gt; 4 cawan per hari per klinik.</p>`;
}
function calcWood(){
  const v = id => Number($('#'+id)?.value);
  const prev = v('w_prev')/100, sens = v('w_sens')/100, spec = v('w_spec')/100;
  ['w_prev','w_sens','w_spec'].forEach(id => $('#'+id+'_o').textContent = $('#'+id).value + '%');
  const N = 100, P = Math.round(N*prev), Nn = N - P;
  const TP = Math.round(P*sens), FN = P - TP, TN = Math.round(Nn*spec), FP = Nn - TN;
  const glow = TP + FP; const ppv = glow ? TP/glow : 0; const npv = (TN+FN) ? TN/(TN+FN) : 0;
  const dots = [...Array(TP).fill('tp'), ...Array(FP).fill('fp'), ...Array(FN).fill('fn'), ...Array(TN).fill('tn')];
  $('#woodDots').innerHTML = dots.map(t => `<i title="${t}" style="${t==='tp'?'background:var(--red)':t==='fp'?'background:var(--amber)':t==='fn'?'border:2px solid var(--red);background:transparent':'background:var(--surface-2);border:1px solid var(--line)'}"></i>`).join('');
  $('#woodOut').innerHTML = `
    <div class="heat r"><small>Kucing berkultur positif yang lolos (tak berpendar)</small><span class="big">${FN} dari ${P}</span><small>dipulangkan masih membawa spora</small></div>
    <div class="heat a"><small>Kucing berpendar yang kulturnya negatif</small><span class="big">${FP} dari ${glow}</span><small>${glow ? nf(FP/glow*100,1) : 0}% pendaran tidak terkonfirmasi kultur</small></div>
    <div class="stat"><span class="k">Nilai duga positif · negatif</span><span class="mono" style="font-weight:600">${nf(ppv*100,1)}% · ${nf(npv*100,1)}%</span></div>
    <p class="note" style="margin:0">Lampu Wood keliru ke dua arah: meloloskan kucing yang masih membawa jamur dan menahan kucing yang sudah bebas jamur. Karena itu SIKAT mengunci penutupan kasus pada kultur.</p>`;
}

    <div class="row" style="gap:6px"><button class="btn ${role<0?'':'ghost'} sm" data-act="role" data-v="-1">Semua</button>${RACI_COLS.map((r, i) => `<button class="btn ${role===i?'':'ghost'} sm" data-act="role" data-v="${i}">${r}</button>`).join('')}</div>
    <div class="tbl-wrap"><table class="raci"><thead><tr><th>Kegiatan</th>${RACI_COLS.map((r, i) => `<th class="${role===i?'hl':''}">${r}</th>`).join('')}</tr></thead><tbody>
      ${RACI.map(([k, v]) => { const show = role < 0 || v[role]; return `<tr class="${show?'':'dim'}"><td>${k}</td>${v.map((x, i) => `<td>${x ? `<span class="rc ${x}">${x==='RA'?'R·A':x}</span>` : ''}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div>
    ${role >= 0 ? `<div class="callout navy"><b>${RACI_COLS[role]}</b> memegang keputusan pada: ${RACI.filter(r => r[1][role]==='RA').map(r => r[0].toLowerCase()).join(', ') || 'tidak ada (berperan sebagai pemberi masukan atau penerima informasi)'}.</div>` : ''}
  </div></section>
  <div class="foot">Sumber: Moriello dkk. (2017), ABCD (2026), Stuntebeck &amp; Moriello (2020), Mrazkova dkk. (2023), Yulianti dkk. (2021), Peraturan Rektor UB 62/2017 dan 28/2022, PP 28/2023. Purwarupa pendukung esai SIKAT; bukan pengganti penilaian klinis dokter hewan.</div>`;
}

/* ============ events ============ */
const cur = () => S.cases.find(c => c.id === ui.caseId);
function findK(kid, cid){ const c = cid ? S.cases.find(x => x.id === cid) : S.cases.find(x => x.kultur.some(k => k.id === kid)); return {c, k: c?.kultur.find(k => k.id === kid)}; }
function setResult(kid, cid, val){
  const {c, k} = findK(kid, cid); if (!k) return;
  const d = diffDays(k.tgl, TODAY);
  if (val === '' || isNaN(val) || val < 0) { toast('Isi jumlah koloni (angka 0 atau lebih)'); return; }
  if (Number(val) === 0 && d < 21) { toast(`Negatif baru sah setelah 21 hari. Sampel ini baru hari ke-${d}.`); return; }
  k.koloni = Number(val); S.demo = S.demo; save(); const g = gateOf(c); toast(`${c.nama}: ${pScore(val)} → ${g.judul.toLowerCase()}`); render();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, c = cur();
  switch (a) {
    case 'open': go('kasus-' + b.dataset.id); break;
    case 'newcase': ui.newForm = true; ui.newPre = {}; if (ui.tab !== 'kasus' || ui.caseId) go('kasus'); else render(); setTimeout(() => $('#nc_nama')?.focus(), 30); break;
    case 'cancelNew': ui.newForm = false; render(); break;
    case 'filter': ui.filter = b.dataset.v; if (ui.tab !== 'kasus' || ui.caseId) go('kasus'); else render(); break;
    case 'setKol': { const inp = document.querySelector(`[data-kol="${b.dataset.k}"]`); setResult(b.dataset.k, b.dataset.c, inp?.value === '' ? '' : Number(inp?.value)); break; }
    case 'setNeg': setResult(b.dataset.k, b.dataset.c, 0); break;
    case 'delKul': c.kultur = c.kultur.filter(k => k.id !== b.dataset.k); save(); render(); toast('Hasil kultur dihapus'); break;
    case 'close': c.ditutup = TODAY; c.kambuh = null; save(); render(); toast(`${c.nama} ditutup. Pemantauan 90 hari dimulai.`); break;
    case 'relapse': c.kambuh = TODAY; save(); render(); toast('Positif ulang dicatat'); break;
    case 'reopen': c.ditutup = null; c.kambuh = null; save(); render(); toast('Kasus dibuka kembali'); break;
    case 'del': ui.confirm = 'del'; render(); break;
    case 'delYes': S.cases = S.cases.filter(x => x.id !== c.id); ui.confirm = null; save(); go('kasus'); toast('Kasus dihapus'); break;
    case 'cancel': ui.confirm = null; render(); break;
    case 'obat': c.obat = b.dataset.v; save(); render(); break;
    case 'delMem': c.keluarga = c.keluarga.filter(m => m.id !== b.dataset.m); save(); render(); break;
    case 'dlKartu': { const d = kartuData(c); offerFile(`Kartu-Serumah-${d.nama.replace(/\W+/g,'-')}.html`, kartuFile(d)); break; }
    case 'copyKartu': copyText(kartuText(kartuData(c))); break;
    case 'ai': runAI(c); break;
    case 'copyAI': copyText(ui.aiText || ''); break;
    case 'qset': S.quick.koloni = Number(b.dataset.v); if (S.quick.koloni === 0 && Number(S.quick.neg) < 1) S.quick.neg = 1; if (S.quick.koloni > 0) S.quick.neg = 0; save(); render(); break;
    case 'qDl': { const q = S.quick; offerFile(`Kartu-Serumah-${(q.nama||'kucing').replace(/\W+/g,'-')}.html`, kartuFile({nama:q.nama||'-', pemilik:q.pemilik||'-', klinik:'Klinik mitra', positif:true, pLast: pScore(q.koloni) ?? '–', bebas:q.bebas, cuci:q.cuci, keluarga:[]})); break; }
    case 'qCopy': { const q = S.quick; copyText(kartuText({nama:q.nama||'-', pemilik:q.pemilik||'-', klinik:'Klinik mitra', pLast: pScore(q.koloni) ?? '–', bebas:q.bebas, cuci:q.cuci})); break; }
    case 'qSave': { const q = S.quick; ui.newForm = true; ui.newPre = {nama:q.nama, pemilik:q.pemilik, riskHint: q.risk}; ui.fromQuick = true; go('kasus'); break; }
    case 'scen': {
      const set = (id, v) => { const el = $('#'+id); if (el) el.value = v; };
      if (b.dataset.v === 'berat') { set('s_kasus', 195); set('s_berat', 100); set('s_ganda', 100); }
      else { set('s_kasus', b.dataset.v); set('s_berat', 4.6); }
      calcBeban(); break; }
    case 'wood': {
      const set = (id, v) => { $('#'+id).value = v; };
      if (b.dataset.v === 'ceko') { set('w_prev', 30); set('w_sens', 71); set('w_spec', 92); }
      else { set('w_prev', 10); set('w_sens', 100); set('w_spec', 50); }
      calcWood(); toast(b.dataset.v === 'bogor' ? 'Bogor: 11 dari 20 berpendar, hanya 2 kultur positif (diskalakan ke 100)' : 'Ceko: sensitivitas 71%, spesifisitas 92%'); break; }
    case 'role': ui.role = Number(b.dataset.v); render(); break;
    case 'sopReset': S.done = {}; save(); render(); break;
    case 'exportJSON': offerFile(`sikat-cadangan-${TODAY}.json`, JSON.stringify(S, null, 2)); break;
    case 'exportCSV': {
      const head = ['nama','pemilik','klinik','wilayah','mulai','gerbang','skor_terakhir','jumlah_kultur','rumah_berisiko','ditutup','positif_ulang'];
      const rows = S.cases.map(c => { const g = gateOf(c), l = resulted(c).slice(-1)[0]; return [c.nama, c.pemilik, c.klinik, c.wilayah, c.mulai, g.judul, l ? pScore(l.koloni) : '', c.kultur.length, isRisky(c) ? 'ya' : 'tidak', c.ditutup || '', c.kambuh || '']; });
      offerFile(`sikat-rekap-${TODAY}.csv`, [head, ...rows].map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n')); break; }
    case 'reseed': S.cases = seed(); S.demo = true; save(); render(); toast('Data contoh dimuat ulang'); break;
    case 'clear': ui.confirm = 'clear'; render(); break;
    case 'clearYes': S.cases = []; S.demo = false; ui.confirm = null; save(); render(); toast('Semua kasus dihapus'); break;
  }
});

document.addEventListener('change', e => {
  const t = e.target, c = cur();
  if (t.dataset.risk && c) { c.risiko[t.dataset.risk] = t.checked; save(); render(); return; }
  if (t.dataset.bersih && c) { c.bersih = c.bersih || {}; c.bersih[t.dataset.bersih] = t.checked; save(); render(); return; }
  if (t.dataset.prak && c) { c.praktik[t.dataset.prak] = t.checked; save(); render(); return; }
  if (t.dataset.mem && c) { const m = c.keluarga.find(x => x.id === t.dataset.mem); m[t.dataset.f] = t.checked; if (!(m.kepala||m.tubuh||m.gatal)) m.dirujuk = false; save(); render(); return; }
  if (t.dataset.sop) { S.done[t.dataset.sop] = t.checked; save(); render(); return; }
  if (t.id === 'bb' && c) { c.bb = Math.max(0.3, Number(t.value) || c.bb); save(); render(); return; }
  if (t.id === 'fWil') { ui.wilayah = t.value; render(); return; }
  if (t.id === 'labCap') { S.labCap = Number(t.value); save(); render(); return; }
  if (t.id === 'importFile' && t.files[0]) {
    const fr = new FileReader(); fr.onload = () => { try { const o = JSON.parse(fr.result); if (!Array.isArray(o.cases)) throw 0; S = {...S, ...o}; save(); render(); toast(`${o.cases.length} kasus diimpor`); } catch(_) { toast('File bukan cadangan SIKAT yang valid'); } }; fr.readAsText(t.files[0]); return; }
  if (t.id?.startsWith('qk_')) { quickRead(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; const pos = t.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'catatan') { const c = cur(); if (c) { c.catatan = t.value; clearTimeout(t._s); t._s = setTimeout(save, 400); } }
  if (t.type === 'range' && ui.tab === 'simulator') { t.id.startsWith('s_') ? calcBeban() : calcWood(); }
  if (t.id?.startsWith('qk_') && t.type !== 'checkbox' && t.tagName !== 'SELECT') { quickRead(); const id = t.id, pos = t.selectionStart; render(); const n = $('#'+id); n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} }
});
function quickRead(){
  const q = S.quick;
  q.koloni = $('#qk_kol').value === '' ? '' : Number($('#qk_kol').value);
  q.lesi = $('#qk_lesi').value === '1'; q.neg = $('#qk_neg').value; q.risk = $('#qk_risk').value === '1';
  q.nama = $('#qk_nama').value; q.pemilik = $('#qk_pemilik').value; q.bebas = $('#qk_bebas').checked; q.cuci = $('#qk_cuci').checked;
  if (q.koloni > 0) q.neg = 0;
  save();
}
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, c = cur();
  if (f.id === 'newCase') {
    const nama = $('#nc_nama').value.trim(), pemilik = $('#nc_pemilik').value.trim(); if (!nama || !pemilik) return;
    const risiko = {}; RISIKO.forEach(([k]) => risiko[k] = $('#nc_r_'+k).checked);
    const nc = {id: uid(), nama, pemilik, hp:'', wilayah: $('#nc_wil').value, klinik: $('#nc_klinik').value, bb: Number($('#nc_bb').value) || 4, mulai: $('#nc_tgl').value || TODAY, risiko,
      kultur: [{id: uid(), tgl: $('#nc_tgl').value || TODAY, koloni: null, lesi: $('#nc_lesi').checked}], obat:'itra', keluarga:[], praktik:{bebas:false, cuci:false}, bersih:{}, ditutup:null, kambuh:null, catatan:''};
    if (ui.fromQuick && S.quick.koloni !== '') { nc.kultur[0].koloni = Number(S.quick.koloni); nc.kultur[0].lesi = S.quick.lesi; nc.praktik = {bebas:S.quick.bebas, cuci:S.quick.cuci}; }
    ui.fromQuick = false; S.cases.push(nc); ui.newForm = false; save(); go('kasus-' + nc.id); toast(`${nama} tercatat, sampel masuk antrean lab`);
  }
  if (f.id === 'addKultur' && c) {
    const tgl = $('#ak_tgl').value || TODAY, kv = $('#ak_kol').value; const d = diffDays(tgl, TODAY);
    if (kv !== '' && Number(kv) === 0 && d < 21) { toast(`Negatif baru sah setelah 21 hari inkubasi (sampel ini hari ke-${d}). Kosongkan kolom koloni.`); return; }
    c.kultur.push({id: uid(), tgl, koloni: kv === '' ? null : Number(kv), lesi: $('#ak_lesi').checked});
    if (c.kambuh) { c.ditutup = null; c.kambuh = null; }
    save(); render(); toast(kv === '' ? 'Sampel masuk antrean inkubasi' : 'Hasil kultur dicatat');
  }
  if (f.id === 'addMem' && c) {
    const nama = $('#am_nama').value.trim(); if (!nama) return;
    c.keluarga.push({id: uid(), nama, hub: $('#am_hub').value.trim() || '-', kepala:false, tubuh:false, gatal:false, dirujuk:false}); save(); render();
  }
});

/* ============ asisten pesan (sample) ============ */
async function runAI(c){
  if (!AI) return;
  const g = gateOf(c), a = nextAction(c), d = kartuData(c);
  const hist = sortedKultur(c).map(k => `${k.tgl}: ${k.koloni === null ? 'masih inkubasi' : pScore(k.koloni) + ' (' + k.koloni + ' koloni)'}${k.lesi ? ', lesi ada' : ''}`).join('; ');
  const fam = d.keluarga.filter(m => m.kepala||m.tubuh||m.gatal).map(m => `${m.nama} (${m.hub})${m.dirujuk ? ' sudah ke puskesmas' : ' belum ke puskesmas'}`).join(', ');
  const prompt = `Kamu membantu dokter hewan klinik menulis pesan WhatsApp untuk pemilik kucing dalam bahasa Indonesia yang sederhana, hangat, dan jelas. Jangan mengubah keputusan klinis, jangan menyebut dosis obat, jangan membuat diagnosis pada manusia. Maksimal 120 kata, tanpa markdown, sapa pemilik dengan namanya.
Data kasus:
- Kucing: ${c.nama}; pemilik: ${c.pemilik}
- Status gerbang SIKAT: ${g.judul} (${g.sub}). Artinya: ${g.teks}
- Langkah berikut: ${a ? a.txt : 'tidak ada'}
- Riwayat kultur: ${hist}
- Rumah berisiko: ${isRisky(c) ? 'ya' : 'tidak'}
- Anggota keluarga berlesi: ${fam || 'tidak ada'}
- Praktik berisiko: ${[d.bebas?'kucing bebas berkeliaran':'', d.cuci?'tidak cuci tangan sebelum memegang kucing':''].filter(Boolean).join(', ') || 'tidak ada'}
Tulis pesannya saja.`;
  ui.aiFor = c.id; ui.aiText = ''; const out = $('#aiOut'); out.textContent = 'Menyusun…';
  try {
    const r = await AI(prompt, {modelTier:'quick', cache:false, onText: ({text}) => { ui.aiText = text; const o = $('#aiOut'); if (o) o.textContent = text; }});
    ui.aiText = r.text; render();
  } catch(err) {
    const o = $('#aiOut'); if (o) o.textContent = err?.code === 'rate_limited' ? 'Terlalu banyak permintaan. Coba lagi sebentar.' : err?.code === 'not_granted' ? 'Asisten tidak diizinkan pada tampilan ini.' : 'Asisten tidak dapat dihubungi saat ini.';
  }
}

route();
(async () => {
  if (!window.claude?.use) return;
  try { DL = await claude.use('downloads'); } catch(e){}
  try { AI = await claude.use('sample'); } catch(e){}
  if (AI && ui.tab === 'kasus' && ui.caseId) render();
})();
</script>
